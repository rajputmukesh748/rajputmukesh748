name: Update Profile

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - "scripts/generate_profile.py"

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  build:
    name: Generate profile images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile SVGs (stats, 3D contribution view, header)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile.py "${{ github.repository_owner }}"

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets scripts/.profile_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile images"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
